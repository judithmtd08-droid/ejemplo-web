<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Mi página web</h1>
        <nav>
            <details>
                <summary>Ir a un ejercicio</summary>
                <div class="menu">
                    <a href="index.html">Inicio</a>

                    <a href="1html.html">Ejercicio 2: HTML</a>
                    <a href="horario.html">Ejercicio 3: Horario</a>
                </div>
            </details>
        </nav>
    </header>
    <main>
        <h2>Formulario de contacto</h2>
        <form>
            <fieldset>
                <legend>Datos de contacto</legend>
                <p><label for="nombre">Nombre:</label><br><input type="text" id="nombre" name="nombre" required></p>
                <p><label for="apellido">Apellidos:</label><br><input type="text" id="apellido" name="apellido" required></p>
                <p><label for="email">Email:</label><br><input type="email" id="email" name="email" required></p>
                <p><label for="contrasena">Contraseña:</label><br><input type="password" id="contrasena" name="contrasena" required></p>
                <p><label for="telefono">Teléfono:</label><br><input type="tel" id="telefono" name="telefono"></p>
                <p><label for="comentario">Comentario:</label><br><textarea id="comentario" name="comentario" rows="5" cols="35"></textarea></p>
            </fieldset>
            <fieldset>
                <legend>Otros datos</legend>
                <p><label for="fecha">Fecha:</label> <input type="date" id="fecha" name="fecha"></p>
                <p><label for="hora">Hora:</label> <input type="time" id="hora" name="hora"></p>
                <p><label for="color">Color favorito:</label> <input type="color" id="color" name="color"></p>
                <p><label for="mes">Mes:</label> <input type="month" id="mes" name="mes"></p>
            </fieldset>
            <p><button type="submit">Enviar</button> <button type="reset">Borrar</button></p>
        </form>
    </main>
    <footer>
        <p>Hecho por Judith · 2026</p>
        <p>CIFP Virgen de Gracia</p>
    </footer>
</body>
</html>
